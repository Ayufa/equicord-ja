name: Release Installer exe

# 手動実行で、起動するだけで日本語版 Equicord を Discord にインストールできる
# 単体 exe (EquicordJA-Setup.exe) をビルドして GitHub Release に公開する。
# 本家リポジトリには一切アクセスしない（EquilotlCli.exe の公開リリース
# ファイルをダウンロードするだけ。これは本家の pnpm inject も行っている）。

on:
    workflow_dispatch:
        inputs:
            version:
                description: "バージョン（例: 1.2.0。空欄なら前回から自動で繰り上げ）"
                required: false
                type: string
            bump:
                description: "空欄で自動繰り上げする場合の上げ方"
                required: false
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch
            notes:
                description: "今回の変更内容（不具合修正の内容など。リリースノートに載ります）"
                required: false
                type: string
            prerelease:
                description: "プレリリースとして公開する（アプリ内アップデーターの対象外になります）"
                required: false
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    build-installer:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build Equicord
              shell: pwsh
              env:
                  EQUICORD_REMOTE: Ayufa/equicord-ja
              run: |
                  corepack enable
                  pnpm install --frozen-lockfile
                  pnpm buildStandalone

            - name: Download Equilotl CLI installer
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                      -Uri "https://github.com/Equicord/Equilotl/releases/latest/download/EquilotlCli.exe" `
                      -OutFile "installer/EquicordJA.Setup/EquilotlCli.exe"

            - name: Stage asar payload
              shell: pwsh
              run: |
                  Copy-Item "dist/desktop.asar" "installer/EquicordJA.Setup/equicord.asar"

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Publish launcher exe
              shell: pwsh
              run: |
                  dotnet publish installer/EquicordJA.Setup/EquicordJA.Setup.csproj `
                      -c Release -o out
                  Get-Item out/EquicordJA-Setup.exe | Select-Object Name, Length

            - name: Decide version and tag
              id: tag
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $version = "${{ inputs.version }}"
                  if ([string]::IsNullOrWhiteSpace($version)) {
                      $bump = "${{ inputs.bump }}"
                      if ([string]::IsNullOrWhiteSpace($bump)) { $bump = "patch" }
                      $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
                      $latest = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
                      if ($latest) {
                          $parts = $latest.TrimStart('v').Split('.') | ForEach-Object { [int]$_ }
                          switch ($bump) {
                              "major" { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
                              "minor" { $parts[1]++; $parts[2] = 0 }
                              default { $parts[2]++ }
                          }
                          $version = "$($parts[0]).$($parts[1]).$($parts[2])"
                      } else {
                          $version = "1.0.0"
                      }
                  }
                  if ("${{ inputs.prerelease }}" -eq "true" -and $version -notmatch "-") {
                      $version = "$version-pre"
                  }
                  "version=$version" >> $env:GITHUB_OUTPUT
                  "tag=v$version" >> $env:GITHUB_OUTPUT

            - name: Create GitHub Release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $changes = "${{ inputs.notes }}"
                  if ([string]::IsNullOrWhiteSpace($changes)) { $changes = "- 保守・改善のための更新" }
                  $notes = @"
                  日本語化した Equicord を Discord にインストールする exe です。

                  ## 今回の変更内容
                  $changes

                  ## 使い方
                  1. 下の EquicordJA-Setup.exe をダウンロード
                  2. 起動して「インストール」ボタンを押すだけ（Discord が起動中なら、終了するか聞かれます）
                  3. 完了したら Discord を起動

                  - 初回は Windows SmartScreen の警告が出ることがあります。その場合は「詳細情報」→「実行」を選んでください（署名のない個人ビルドのため）。
                  - 本体は %LOCALAPPDATA%\equicord-ja\equicord.asar に配置され、そこを参照する形でインストールされます。
                  - 更新は Discord 内の Equicord 設定「Updater」からもできます（このリポジトリの最新リリースを見に行きます）。exe を再実行して上書き更新もできます。
                  - アンインストール: 起動して「アンインストール」ボタンを押してください。
                  "@
                  $hash = git rev-parse --short=8 HEAD
                  $preFlag = @()
                  if ("${{ inputs.prerelease }}" -eq "true") { $preFlag = @("--prerelease") }
                  gh release create "${{ steps.tag.outputs.tag }}" "out/EquicordJA-Setup.exe" "dist/desktop.asar" `
                      --title "Equicord JA v${{ steps.tag.outputs.version }} $hash" `
                      --notes $notes @preFlag
