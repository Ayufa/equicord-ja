name: Release Installer exe

# 手動実行で、起動するだけで日本語版 Equicord を Discord にインストールできる
# 単体 exe (EquicordJA-Setup.exe) をビルドして GitHub Release に公開する。
# 本家リポジトリには一切アクセスしない（EquilotlCli.exe の公開リリース
# ファイルをダウンロードするだけ。これは本家の pnpm inject も行っている）。

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "リリースのタグ（空欄なら日時から自動生成）"
                required: false
                type: string

permissions:
    contents: write

jobs:
    build-installer:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build Equicord
              shell: pwsh
              env:
                  EQUICORD_REMOTE: Ayufa/equicord-ja
              run: |
                  corepack enable
                  pnpm install --frozen-lockfile
                  pnpm buildStandalone

            - name: Download Equilotl CLI installer
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                      -Uri "https://github.com/Equicord/Equilotl/releases/latest/download/EquilotlCli.exe" `
                      -OutFile "installer/EquicordJA.Setup/EquilotlCli.exe"

            - name: Stage asar payload
              shell: pwsh
              run: |
                  Copy-Item "dist/desktop.asar" "installer/EquicordJA.Setup/equicord.asar"

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Publish launcher exe
              shell: pwsh
              run: |
                  dotnet publish installer/EquicordJA.Setup/EquicordJA.Setup.csproj `
                      -c Release -o out
                  Get-Item out/EquicordJA-Setup.exe | Select-Object Name, Length

            - name: Decide release tag
              id: tag
              shell: pwsh
              run: |
                  $tag = "${{ inputs.tag }}"
                  if ([string]::IsNullOrWhiteSpace($tag)) {
                      $tag = "setup-" + (Get-Date -Format "yyyyMMdd-HHmm")
                  }
                  "tag=$tag" >> $env:GITHUB_OUTPUT

            - name: Create GitHub Release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $notes = @"
                  日本語化した Equicord を Discord にインストールする exe です。

                  ## 使い方
                  1. 下の EquicordJA-Setup.exe をダウンロード
                  2. 起動して「インストール」ボタンを押すだけ（Discord が起動中なら、終了するか聞かれます）
                  3. 完了したら Discord を起動

                  - 初回は Windows SmartScreen の警告が出ることがあります。その場合は「詳細情報」→「実行」を選んでください（署名のない個人ビルドのため）。
                  - 本体は %LOCALAPPDATA%\equicord-ja\equicord.asar に配置され、そこを参照する形でインストールされます。
                  - 更新は Discord 内の Equicord 設定「Updater」からもできます（このリポジトリの最新リリースを見に行きます）。exe を再実行して上書き更新もできます。
                  - アンインストール: 起動して「アンインストール」ボタンを押してください。
                  "@
                  $hash = git rev-parse HEAD
                  gh release create "${{ steps.tag.outputs.tag }}" "out/EquicordJA-Setup.exe" "dist/desktop.asar" `
                      --title "Equicord JA Setup ${{ steps.tag.outputs.tag }} $hash" `
                      --notes $notes
